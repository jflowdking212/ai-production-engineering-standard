name: APES Self-Test

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "package.json"
      - "VERSION"
      - "templates/project-repo/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "package.json"
      - "VERSION"
      - "templates/project-repo/**"

permissions:
  contents: read

jobs:
  self-test:
    name: APES Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout APES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Syntax-check scripts and tests
        shell: bash
        run: |
          set -euo pipefail
          find scripts tests -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('templates/project-repo/.apes.json','utf8'));"
      - name: Run APES regression/security suite
        run: npm test
